  <link rel="icon" type="image/png" href="icons/favicon.png">

<body>
  <header class="barra">
    <a href="#/" class="barra__marca" aria-label="Inicio">
      <img src="icons/icon-192.png" alt="" width="36" height="36">
      <span>Club <b>OliJuli</b></span>
    </a>
    <div class="barra__derecha">
      <button class="barra__gato" id="cambiarGato" type="button" hidden></button>
      <a class="barra__ajustes" href="#/ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
    </div>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#/" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-5h-6v5H4z"/></svg><span>Inicio</span></a>

  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>

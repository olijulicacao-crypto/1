# Publicación del Club OliJuli en Netlify (sitio estático, sin compilar nada).
[build]
  base = "club-olijuli"
  publish = "."
  command = ""

# El service worker y el manifiesto no se guardan en caché, para que las mejoras lleguen al tiro.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
